<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minecraft Lite</title>

<style>
body{
    margin:0;
    overflow:hidden;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    background:rgba(0,0,0,.5);
    padding:10px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:30px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

</head>
<body>

<div id="hud">
WASD = bewegen<br>
SPATIE = springen<br>
LINKS = slopen<br>
RECHTS = plaatsen
</div>

<div id="crosshair">+</div>

<script type="module">

import * as THREE from "three";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const sun =
new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
50,
100,
50
);

scene.add(sun);

scene.add(
new THREE.AmbientLight(
0xffffff,
0.6
)
);

const blocks = [];

function createBlock(
x,
y,
z,
color
){

const cube =
new THREE.Mesh(

new THREE.BoxGeometry(),

new THREE.MeshLambertMaterial({
color
})

);

cube.position.set(
x,
y,
z
);

scene.add(cube);

blocks.push(cube);

return cube;

}

for(
let x=-20;
x<20;
x++
){

for(
let z=-20;
z<20;
z++
){

let height =
Math.floor(
Math.random()*3
)+1;

for(
let y=0;
y<height;
y++
){

let color =
y===height-1
?
0x44aa44
:
0x8B4513;

createBlock(
x,
y,
z,
color
);

}

}

}

camera.position.set(
0,
5,
5
);

const keys = {};

document.addEventListener(
"keydown",
e=>{
keys[e.key.toLowerCase()]
=
true;
}
);

document.addEventListener(
"keyup",
e=>{
keys[e.key.toLowerCase()]
=
false;
}
);

document.body.addEventListener(
"click",
()=>{
document.body.requestPointerLock();
}
);

let yaw = 0;
let pitch = 0;

document.addEventListener(
"mousemove",
e=>{

if(
document.pointerLockElement
){

yaw -=
e.movementX
*
0.002;

pitch -=
e.movementY
*
0.002;

pitch =
Math.max(
-1.5,
Math.min(
1.5,
pitch
)
);

}

}
);

let velocityY = 0;

window.addEventListener(
"contextmenu",
e=>{

e.preventDefault();

let x =
Math.round(
camera.position.x
);

let y =
Math.round(
camera.position.y
-2
);

let z =
Math.round(
camera.position.z
);

createBlock(
x,
y,
z,
0x44aa44
);

}
);

window.addEventListener(
"mousedown",
e=>{

if(
e.button !== 0
)
return;

const raycaster =
new THREE.Raycaster();

raycaster.setFromCamera(
new THREE.Vector2(0,0),
camera
);

const hits =
raycaster.intersectObjects(
blocks
);

if(
hits.length
){

const hit =
hits[0].object;

scene.remove(
hit
);

blocks.splice(
blocks.indexOf(hit),
1
);

}

}
);

const zombie =
new THREE.Mesh(

new THREE.BoxGeometry(
1,
2,
1
),

new THREE.MeshLambertMaterial({
color:0x00aa00
})

);

zombie.position.set(
10,
3,
10
);

scene.add(
zombie
);

let time = 0;

function animate(){

requestAnimationFrame(
animate
);

camera.rotation.order
=
"YXZ";

camera.rotation.y
=
yaw;

camera.rotation.x
=
pitch;

const speed = 0.08;

if(keys["w"]){

camera.position.x -=
Math.sin(yaw)
* speed;

camera.position.z -=
Math.cos(yaw)
* speed;

}

if(keys["s"]){

camera.position.x +=
Math.sin(yaw)
* speed;

camera.position.z +=
Math.cos(yaw)
* speed;

}

if(keys["a"]){

camera.position.x -=
Math.cos(yaw)
* speed;

camera.position.z +=
Math.sin(yaw)
* speed;

}

if(keys["d"]){

camera.position.x +=
Math.cos(yaw)
* speed;

camera.position.z -=
Math.sin(yaw)
* speed;

}

velocityY -= 0.01;

camera.position.y +=
velocityY;

if(
camera.position.y < 5
){

camera.position.y = 5;

velocityY = 0;

}

if(
keys[" "] &&
camera.position.y <= 5.01
){

velocityY = 0.25;

}

let dx =
camera.position.x -
zombie.position.x;

let dz =
camera.position.z -
zombie.position.z;

let distance =
Math.sqrt(
dx*dx +
dz*dz
);

if(distance < 20){

zombie.position.x +=
dx * 0.005;

zombie.position.z +=
dz * 0.005;

}

if(distance < 1.5){

alert(
"Zombie heeft je gepakt!"
);

location.reload();

}

time += 0.002;

sun.position.x =
Math.cos(time)
* 100;

sun.position.y =
Math.sin(time)
* 100;

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
