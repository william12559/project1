<!DOCTYPE html>
<html>
<head>
<title>Impossible Square</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
}

#player{
    width:20px;
    height:20px;
    background:lime;
    position:absolute;
}

.obstacle{
    position:absolute;
    background:red;
}
</style>
</head>
<body>

<div id="player"></div>

<script>
const player = document.getElementById("player");

let x = innerWidth/2;
let y = innerHeight/2;
let speed = 6;
let gameSpeed = 3;
let reversed = false;
let score = 0;

const keys = {};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

const obstacles = [];

function spawnObstacle(){

    let side = Math.floor(Math.random()*4);

    let obs = document.createElement("div");
    obs.className = "obstacle";

    let size = 20 + Math.random()*60;
    obs.style.width = size+"px";
    obs.style.height = size+"px";

    let ox,oy,vx,vy;

    if(side===0){
        ox=-size;
        oy=Math.random()*innerHeight;
        vx=gameSpeed;
        vy=0;
    }

    if(side===1){
        ox=innerWidth;
        oy=Math.random()*innerHeight;
        vx=-gameSpeed;
        vy=0;
    }

    if(side===2){
        ox=Math.random()*innerWidth;
        oy=-size;
        vx=0;
        vy=gameSpeed;
    }

    if(side===3){
        ox=Math.random()*innerWidth;
        oy=innerHeight;
        vx=0;
        vy=-gameSpeed;
    }

    obs.x=ox;
    obs.y=oy;
    obs.vx=vx;
    obs.vy=vy;

    document.body.appendChild(obs);

    obstacles.push(obs);
}

setInterval(spawnObstacle,250);

function collide(a,b){
    return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
    );
}

function update(){

    let move = reversed ? -1 : 1;

    if(keys["ArrowLeft"] || keys["a"]) x -= speed*move;
    if(keys["ArrowRight"] || keys["d"]) x += speed*move;
    if(keys["ArrowUp"] || keys["w"]) y -= speed*move;
    if(keys["ArrowDown"] || keys["s"]) y += speed*move;

    x=Math.max(0,Math.min(innerWidth-20,x));
    y=Math.max(0,Math.min(innerHeight-20,y));

    player.style.left=x+"px";
    player.style.top=y+"px";

    for(let obs of obstacles){

        obs.x += obs.vx;
        obs.y += obs.vy;

        obs.style.left=obs.x+"px";
        obs.style.top=obs.y+"px";

        let hit = collide(
            {x,y,w:20,h:20},
            {
                x:obs.x,
                y:obs.y,
                w:parseInt(obs.style.width),
                h:parseInt(obs.style.height)
            }
        );

        if(hit){
            alert("GAME OVER\nScore: "+Math.floor(score));
            location.reload();
        }
    }

    score += 0.016;

    if(score > 10){
        gameSpeed = 5;
    }

    if(score > 20){
        gameSpeed = 8;
    }

    if(score > 30){
        document.body.style.transform =
            `rotate(${score*2}deg)`;
    }

    if(score > 60){
        reversed = true;
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
