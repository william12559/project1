<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minecraft Lite</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    background:rgba(0,0,0,.5);
    padding:10px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

</head>
<body>

<div id="hud">
Minecraft Lite<br>
WASD = bewegen<br>
Spatie = springen
</div>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(
    0x87ceeb,
    20,
    120
);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

/* --------------------
   LIGHTS
---------------------*/

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    50,
    100,
    50
);

scene.add(sun);

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.5
    )
);

/* --------------------
   WORLD GENERATION
---------------------*/

const blocks = [];

function createBlock(
    x,
    y,
    z,
    color
){

    const block =
        new THREE.Mesh(
            new THREE.BoxGeometry(1,1,1),
            new THREE.MeshLambertMaterial({
                color
            })
        );

    block.position.set(
        x,
        y,
        z
    );

    scene.add(block);

    blocks.push(block);

    return block;
}

/* --------------------
   TERRAIN
---------------------*/

for(
let x=-25;
x<25;
x++
){

for(
let z=-25;
z<25;
z++
){

const h =
Math.floor(
Math.random()*3
);

for(
let y=0;
y<=h;
y++
){

let color =
0x8B4513;

if(
y===h
){
color=0x55aa55;
}

createBlock(
x,
y,
z,
color
);

}

}

}

/* --------------------
   PLAYER
---------------------*/

camera.position.set(
0,
6,
5
);

let velocityY = 0;
let grounded = false;

const keys = {};

document.addEventListener(
"keydown",
e=>{
keys[e.key.toLowerCase()]
= true;
}
);

document.addEventListener(
"keyup",
e=>{
keys[e.key.toLowerCase()]
= false;
}
);

/* --------------------
   MOUSE LOOK
---------------------*/

let pitch = 0;
let yaw = 0;

document.body.addEventListener(
"click",
()=>{
document.body.requestPointerLock();
}
);

document.addEventListener(
"mousemove",
e=>{

if(
document.pointerLockElement
){

yaw -=
e.movementX * 0.002;

pitch -=
e.movementY * 0.002;

pitch =
Math.max(
-1.5,
Math.min(
1.5,
pitch
)
);

}

}
);

/* --------------------
   BLOCK PLACE
---------------------*/

window.addEventListener(
"contextmenu",
e=>{
e.preventDefault();

const block =
new THREE.Mesh(
new THREE.BoxGeometry(),
new THREE.MeshLambertMaterial({
color:0x55aa55
})
);

block.position.set(
Math.round(
camera.position.x
),
Math.round(
camera.position.y-2
),
Math.round(
camera.position.z
)
);

scene.add(block);

blocks.push(block);

}
);

/* --------------------
   BLOCK BREAK
---------------------*/

window.addEventListener(
"mousedown",
e=>{

if(e.button!==0)
return;

const raycaster =
new THREE.Raycaster();

raycaster.setFromCamera(
new THREE.Vector2(0,0),
camera
);

const hit =
raycaster.intersectObjects(
blocks
);

if(hit.length){

scene.remove(
hit[0].object
);

blocks.splice(
blocks.indexOf(
hit[0].object
),
1
);

}

}
);

/* --------------------
   DAY NIGHT
---------------------*/

let time = 0;

/* --------------------
   INVENTORY
---------------------*/

const inventory = {
dirt:0,
grass:0,
stone:0
};

/* --------------------
   GAME LOOP
---------------------*/

function animate(){

requestAnimationFrame(
animate
);

const speed = 0.08;

camera.rotation.order =
"YXZ";

camera.rotation.y = yaw;
camera.rotation.x = pitch;

if(keys["w"]){

camera.position.x -=
Math.sin(yaw)
* speed;

camera.position.z -=
Math.cos(yaw)
* speed;

}

if(keys["s"]){

camera.position.x +=
Math.sin(yaw)
* speed;

camera.position.z +=
Math.cos(yaw)
* speed;

}

if(keys["a"]){

camera.position.x -=
Math.cos(yaw)
* speed;

camera.position.z +=
Math.sin(yaw)
* speed;

}

if(keys["d"]){

camera.position.x +=
Math.cos(yaw)
* speed;

camera.position.z -=
Math.sin(yaw)
* speed;

}

/* gravity */

velocityY -= 0.01;

camera.position.y +=
velocityY;

if(camera.position.y < 6){

camera.position.y = 6;

grounded = true;

velocityY = 0;

}else{
grounded = false;
}

if(
keys[" "] &&
grounded
){

velocityY = 0.25;

}

/* day and night */

time += 0.001;

sun.position.x =
Math.cos(time)
* 100;

sun.position.y =
Math.sin(time)
* 100;

renderer.render(
scene,
camera
);

}

animate();

/* --------------------
   RESIZE
---------------------*/

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
