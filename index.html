<!DOCTYPE html>
<html>
<head>
    <title>3D Horror Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 30px;
            user-select: none;
        }
    </style>
</head>
<body>

<div id="crosshair">+</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// vloer
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({
        color: 0x444444
    })
);

floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// licht
const light = new THREE.PointLight(0xffffff, 100);
light.position.set(0, 10, 0);
scene.add(light);

// muren
for(let i = 0; i < 50; i++){

    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(5,5,1),
        new THREE.MeshStandardMaterial({
            color: 0xffffaa
        })
    );

    wall.position.set(
        Math.random()*80-40,
        2.5,
        Math.random()*80-40
    );

    scene.add(wall);
}

// monster
const monster = new THREE.Mesh(
    new THREE.BoxGeometry(2,2,2),
    new THREE.MeshStandardMaterial({
        color: 0xff0000
    })
);

monster.position.set(10,1,10);
scene.add(monster);

camera.position.y = 2;

// beweging
const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

// muis lock
document.body.addEventListener("click",()=>{
    document.body.requestPointerLock();
});

let rotY = 0;

document.addEventListener("mousemove",(e)=>{

    if(document.pointerLockElement){

        rotY -= e.movementX * 0.002;
        camera.rotation.y = rotY;
    }
});

function animate(){

    requestAnimationFrame(animate);

    const speed = 0.1;

    if(keys["w"]){
        camera.position.x -= Math.sin(rotY)*speed;
        camera.position.z -= Math.cos(rotY)*speed;
    }

    if(keys["s"]){
        camera.position.x += Math.sin(rotY)*speed;
        camera.position.z += Math.cos(rotY)*speed;
    }

    if(keys["a"]){
        camera.position.x -= Math.cos(rotY)*speed;
        camera.position.z += Math.sin(rotY)*speed;
    }

    if(keys["d"]){
        camera.position.x += Math.cos(rotY)*speed;
        camera.position.z -= Math.sin(rotY)*speed;
    }

    // monster volgt speler
    monster.position.x += (camera.position.x - monster.position.x) * 0.005;
    monster.position.z += (camera.position.z - monster.position.z) * 0.005;

    const distance = camera.position.distanceTo(monster.position);

    if(distance < 1.5){
        alert("GAME OVER");
        location.reload();
    }

    renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
